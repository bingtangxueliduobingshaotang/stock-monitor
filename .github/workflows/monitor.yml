name: stock-monitor

# 定时说明（UTC 时间 = 北京时间 - 8）
#   02:30 UTC = 10:30 北京 → 盘中对策
#   06:00 UTC = 14:00 北京 → 盘中对策
#   06:50 UTC = 14:50 北京 → 盘中对策（收盘前）
#   08:30 UTC = 16:30 北京 → 收盘复盘 + 明日预案
#   盘中每 10 分钟（01:30-03:30 与 05:00-07:00 UTC ≈ 9:30-11:30 / 13:00-15:00 北京）→ 触发告警
on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "50 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    # 2026-11-12：删掉 "*/10" 盘中档。理由：GitHub 对本仓库的 schedule 有 ~7h50m 固定延迟，
    # 这条线实际落在深夜，既重复又扰民；盘中告警全部由 cron-job.org 驱动。
  workflow_dispatch:
    inputs:
      mode:
        description: "手动测试: intraday / close / monitor"
        default: "intraday"
      ext:
        description: "外部定时器标记（外部定时服务传 on；人工手动保持空）"
        default: ""


# 分钟级告警（mode=fast）每 60 秒触发一次，单次约 30 秒。
# cancel-in-progress 保证：上一次没跑完时，新的直接顶掉它，**不会堆积**。
concurrency:
  group: monitor-${{ github.event.inputs.mode || 'sched' }}
  cancel-in-progress: true

permissions:
  contents: write     # 让 GITHUB_TOKEN 能回写 state/last_alerts.json（去重靠它）

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 恢复告警去重状态（当天已推过的信号不重复推；一步式 cache 会在运行结束自动保存）
      - uses: actions/cache@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: |
            alert-state-

      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.mode }}
          EXT_GUARD: ${{ github.event.inputs.ext }}
        run: |
          if [ -n "$MANUAL" ]; then
            MODE="$MANUAL"
          elif [ "$SCHEDULE" = "30 2 * * 1-5" ] || [ "$SCHEDULE" = "0 6 * * 1-5" ] || [ "$SCHEDULE" = "50 6 * * 1-5" ]; then
            MODE=intraday
          elif [ "$SCHEDULE" = "30 8 * * 1-5" ]; then
            MODE=close
          else
            MODE=monitor
          fi
          echo "mode=$MODE"
          # 输出静音：本仓库为 public，Actions 日志对所有人可见，
          # 里面含成本价/浮盈亏/仓位，一律不外泄（2026-11-12）
          python3 stock_monitor.py "$MODE" > run.log 2>&1 || {
            echo "::error::运行失败（日志已隐藏，请本地复现：python github_deploy/stock_monitor.py $MODE）";
            exit 1;
          }
          echo "run ok"
