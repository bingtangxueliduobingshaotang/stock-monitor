name: stock-monitor

# 定时说明（UTC 时间 = 北京时间 - 8）
#   02:30 UTC = 10:30 北京 → 盘中对策
#   06:30 UTC = 14:30 北京 → 盘中对策
#   08:00 UTC = 16:00 北京 → 收盘复盘 + 明日预案
#   盘中每 10 分钟（01:30-03:30 与 05:00-07:00 UTC ≈ 9:30-11:30 / 13:00-15:00 北京）→ 触发告警
on:
  schedule:
    - cron: "30 2 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "*/10 1-3,5-7 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "手动测试: intraday / close / monitor"
        default: "intraday"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 恢复告警去重状态（当天已推过的信号不重复推）
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$MANUAL" ]; then
            MODE="$MANUAL"
          elif [ "$SCHEDULE" = "30 2 * * 1-5" ] || [ "$SCHEDULE" = "30 6 * * 1-5" ]; then
            MODE=intraday
          elif [ "$SCHEDULE" = "0 8 * * 1-5" ]; then
            MODE=close
          else
            MODE=monitor
          fi
          echo "mode=$MODE"
          python3 stock_monitor.py "$MODE"

      # 保存去重状态
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: alert-state-${{ github.run_id }}
